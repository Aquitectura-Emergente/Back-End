# Perfil 'test'. Hasta ahora no existía: cada test de integración traía sus
# propiedades en @TestPropertySource. Esto es solo para apagar lo que corre solo.

# El relay del outbox de AI Forecasting es un @Scheduled: dentro de un test
# dispararía en medio de los asserts y entregaría eventos que el test no espera.
# Los tests que lo ejercitan llaman a drainOnce() directamente, que es
# determinista. En dev/demo/prod está encendido sin necesidad de configurarlo.
emsafe.ai-forecasting.outbox-relay-enabled=false
emsafe.personal-dosimetry.outbox-relay-enabled=false
emsafe.device-management.outbox-relay-enabled=false
