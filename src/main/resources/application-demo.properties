# ── Perfil DEMO (sustentaciones) ─────────────────────────────────────────────
# Backend corriendo en Docker LOCAL, expuesto al mundo por un túnel (ngrok),
# apuntando a la base de datos gestionada TiDB Cloud Serverless (gratis).
#
#   Vercel (front)  ──▶  https://<tu-ngrok>  ──▶  backend:8080 (tu laptop)
#                                                      │
#                                                      ▼
#                                              TiDB Cloud (nube)
#
# Es como el perfil 'prod' (Oracle) pero con dos diferencias:
#   1) La BD NO es local: es TiDB remoto → hacen falta los keepalives de Hikari.
#   2) El front vive en OTRO dominio (Vercel) → CORS vuelve a intervenir.
#
# Variables inyectadas desde deploy/.env.demo:
#   MYSQL_URL  MYSQL_USER  MYSQL_PASSWORD  JWT_SECRET
#   CORS_ALLOWED_ORIGINS  APP_PUBLIC_URL  GEMINI_API_KEY

spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP afinado para TiDB Cloud Serverless: cierra las conexiones ociosas a
# los ~60s, así que las reciclamos ANTES (max-lifetime 55s) y mandamos keepalives
# cada 30s para que el pool no entregue conexiones muertas (EOFException).
spring.datasource.hikari.max-lifetime=55000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.idle-timeout=45000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-test-query=SELECT 1

# El esquema lo gobierna Flyway (V1..V12); Hibernate solo valida que coincida.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.com.emsafe=INFO
logging.level.org.springframework.security=WARN

server.port=${PORT:8080}
# ngrok termina TLS y reenvía como http; sin esto Spring vería http y Swagger
# mostraría enlaces con el esquema equivocado.
server.forward-headers-strategy=framework

# ── Gemini (chatbot "Astra") ─────────────────────────────────────────────────
# Si GEMINI_API_KEY viene vacío, el chat queda desactivado y el resto funciona.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-2.5-flash

# Device Management: demo de punta a punta con los dos Edges
emsafe.mqtt.enabled=${EMSAFE_MQTT_ENABLED:false}
emsafe.device-management.allow-device-lending=true
emsafe.device-management.seed-demo-data=true
emsafe.device-management.seed-demo-session=true
