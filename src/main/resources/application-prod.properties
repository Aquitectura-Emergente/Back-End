# ── Perfil de producción ─────────────────────────────────────────────────────
# Azure Container Apps + TiDB Cloud Serverless.
#
#   Azure Static Web Apps (front)  ──▶  Container App (este backend)
#                                              │
#                                              ▼
#                                       TiDB Cloud (nube, gratis)
#
# La base de datos NO está en Azure, y no es un atajo: la suscripción tiene una
# política ("Allowed resource deployment regions") que solo permite
# canadacentral, eastus, centralus, brazilsouth y eastus2, y Azure Database for
# MySQL no existe en ninguna de las cinco. Las regiones donde sí existe están
# prohibidas por esa política, así que la intersección es vacía. TiDB es
# compatible con MySQL y su capa gratuita no consume el crédito de estudiante.
#
# Variables inyectadas (secretos de la Container App):
#   MYSQL_URL  MYSQL_USER  MYSQL_PASSWORD  JWT_SECRET
#   CORS_ALLOWED_ORIGINS  APP_PUBLIC_URL  GEMINI_API_KEY

spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP afinado para TiDB Cloud Serverless, que cierra las conexiones ociosas
# a los ~60s. Hay que reciclarlas ANTES (max-lifetime 55s) y mandar keepalives
# cada 30s; si no, el pool entrega conexiones muertas y salen EOFException
# intermitentes que no se reproducen en local. Pool pequeño porque la Container
# App corre con 0.5 vCPU.
spring.datasource.hikari.max-lifetime=55000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.idle-timeout=45000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-test-query=SELECT 1

# El esquema lo gobierna Flyway (V1..V23); Hibernate solo valida que coincida.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.com.emsafe=INFO
logging.level.org.springframework.security=WARN

server.port=${PORT:8080}
# El ingress de Container Apps termina TLS y reenvía como http; sin esto Spring
# vería http y generaría enlaces y redirecciones con el esquema equivocado.
server.forward-headers-strategy=framework

# ── Gemini (chatbot "Astra") ─────────────────────────────────────────────────
# Si GEMINI_API_KEY viene vacío, el chat queda desactivado pero el resto de la
# aplicación funciona con normalidad.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-2.5-flash

# Device Management: sin préstamo de dispositivos ni datos de demo
emsafe.device-management.allow-device-lending=false
emsafe.device-management.seed-demo-data=false
