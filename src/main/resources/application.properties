spring.application.name=emsafe-backend

# Perfil activo. En producción el contenedor define SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ── JWT ──────────────────────────────────────────────────────────────────────
# En producción JWT_SECRET llega por variable de entorno desde el .env.
# El valor por defecto es SOLO para desarrollo local.
jwt.secret=${JWT_SECRET:ZW1zYWZlLXNlY3JldC1rZXktZm9yLWRldi1vbmx5LW5lZWRzLTMyLWJ5dGVzLW1pbmltdW0h}
jwt.expiration=86400000

# ── CORS ─────────────────────────────────────────────────────────────────────
# En producción el frontend se sirve desde el MISMO origen que la API (Caddy),
# así que CORS deja de intervenir. Se mantiene configurable por si algún día se
# consume la API desde otro dominio.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ── URL pública ──────────────────────────────────────────────────────────────
# La usa Swagger para listar el servidor de producción.
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}

# ── Jackson ──────────────────────────────────────────────────────────────────
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ── AI Forecasting & Analytics ───────────────────────────────────────────────
# Umbrales en ratio (0, 1]. El LLM (Gemini) reutiliza gemini.api-key/gemini.model
# y está apagado por defecto: sin él se usa la redacción por plantilla.
emsafe.ai-forecasting.default-shift-hours=8
emsafe.ai-forecasting.critical-margin-ratio=0.10
emsafe.ai-forecasting.moderate-projected-ratio=0.90
emsafe.ai-forecasting.safe-candidate-ratio=0.90
emsafe.ai-forecasting.model-id=LINEAR_RATE
emsafe.ai-forecasting.model-version=1
emsafe.ai-forecasting.llm.enabled=false
emsafe.ai-forecasting.llm.timeout-ms=5000
emsafe.ai-forecasting.seed-demo=false
