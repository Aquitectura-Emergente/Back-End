# ── Development profile ──────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/emsafe_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.com.emsafe=DEBUG
logging.level.org.springframework.security=DEBUG

# ── Gemini (chatbot "Astra" — proxy en /api/client/chat) ─────────────────────
# Free tier. La key vive SOLO en el backend (nunca en la app móvil).
